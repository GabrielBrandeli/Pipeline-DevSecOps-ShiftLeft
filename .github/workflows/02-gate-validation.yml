name: 02-gate-validation

# E7: validacao funcional do Quality Gate (cenarios em ci/validacao-gate/).
on:
  workflow_dispatch:
    inputs:
      rodada:
        description: 'Identificador da rodada (ex.: E7-01)'
        required: true

jobs:
  validar-gate:
    name: E7 - Validacao do Quality Gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar dependencias do script
        run: python3 -m pip install --quiet --break-system-packages pyyaml

      - name: Executar cenarios E7 nos modos audit e enforce
        run: python3 ci/validacao-gate/validar_gate.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e7-${{ inputs.rodada }}
          path: resultado-e7.json
