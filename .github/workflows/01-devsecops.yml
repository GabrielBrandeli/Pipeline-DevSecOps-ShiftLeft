name: 01-devsecops

on:
  workflow_dispatch:
    inputs:
      rodada:
        description: 'Identificador da rodada (ex.: E2-01)'
        required: true
      gate_mode:
        description: 'Modo do Quality Gate (D4)'
        type: choice
        options: [audit, enforce]
        default: audit
      gate_scope:
        description: 'Escopo do Quality Gate (D3)'
        type: choice
        options: [sca_only, all_tools]
        default: sca_only

env:
  GATE_MODE: ${{ inputs.gate_mode }}
  GATE_SCOPE: ${{ inputs.gate_scope }}

jobs:
  sast:
    name: SAST - Semgrep (${{ matrix.perfil }})
    runs-on: ubuntu-24.04
    container:
      image: semgrep/semgrep@sha256:34ab619bf1391a24bfda3f05debd0d8a6ce3093c2d5f9d39cfc00f83c1397823 # 1.176.1
    strategy:
      fail-fast: false
      matrix:
        perfil: [alvo1-juiceshop, alvo2-uptimekuma]
    steps:
      - name: Checkout (com submodulos)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Carregar perfil do alvo
        run: |
          set -a
          source "ci/perfis/${{ matrix.perfil }}.env"
          set +a
          {
            echo "ALVO_ID=$ALVO_ID"
            echo "ALVO_CAMINHO=$ALVO_CAMINHO"
          } >> "$GITHUB_ENV"

      - name: Semgrep scan
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/security-audit \
            --config p/secrets \
            --json --output "semgrep-${ALVO_ID}.json" \
            --metrics=off \
            --timeout 300 \
            --exclude node_modules \
            --exclude dist \
            "$ALVO_CAMINHO"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-${{ matrix.perfil }}-${{ inputs.rodada }}
          path: semgrep-*.json

  build:
    name: Build (${{ matrix.perfil }})
    needs: sast
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        perfil: [alvo1-juiceshop, alvo2-uptimekuma]
    steps:
      - name: Checkout (com submodulos)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Carregar perfil do alvo
        run: |
          set -a
          source "ci/perfis/${{ matrix.perfil }}.env"
          set +a
          {
            echo "ALVO_ID=$ALVO_ID"
            echo "ALVO_CAMINHO=$ALVO_CAMINHO"
            echo "ALVO_IMAGEM=$ALVO_IMAGEM"
            echo "ALVO_DOCKERFILE=$ALVO_DOCKERFILE"
            echo "ALVO_CONTEXTO=$ALVO_CONTEXTO"
            echo "ALVO_BUILD_TARGET=$ALVO_BUILD_TARGET"
            echo "ALVO_PREBUILD=$ALVO_PREBUILD"
          } >> "$GITHUB_ENV"

      - name: Instalar Node.js (quando exigido pelo alvo)
        if: env.ALVO_PREBUILD != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Pre-build da aplicacao (quando exigido pelo alvo)
        if: env.ALVO_PREBUILD != ''
        run: |
          cd "$ALVO_CAMINHO"
          eval "$ALVO_PREBUILD"

      - name: Build da imagem Docker
        run: |
          args=(-t "$ALVO_IMAGEM:${{ github.sha }}" -f "$ALVO_DOCKERFILE")
          if [ -n "$ALVO_BUILD_TARGET" ]; then
            args+=(--target "$ALVO_BUILD_TARGET")
          fi
          args+=("$ALVO_CONTEXTO")
          docker build "${args[@]}"
          docker save "$ALVO_IMAGEM:${{ github.sha }}" -o imagem.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: imagem-${{ matrix.perfil }}-${{ inputs.rodada }}
          path: imagem.tar

  sca:
    name: SCA - Trivy (${{ matrix.perfil }})
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        perfil: [alvo1-juiceshop, alvo2-uptimekuma]
    steps:
      - name: Checkout (com submodulos)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Carregar perfil do alvo
        run: |
          set -a
          source "ci/perfis/${{ matrix.perfil }}.env"
          set +a
          {
            echo "ALVO_ID=$ALVO_ID"
            echo "ALVO_CAMINHO=$ALVO_CAMINHO"
            echo "ALVO_IMAGEM=$ALVO_IMAGEM"
            echo "ALVO_TRIVY_CONFIG_ALVO=$ALVO_TRIVY_CONFIG_ALVO"
            echo "ALVO_TRIVY_CONFIG_PATTERN=$ALVO_TRIVY_CONFIG_PATTERN"
          } >> "$GITHUB_ENV"

      - name: Baixar imagem construida
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: imagem-${{ matrix.perfil }}-${{ inputs.rodada }}

      - name: Carregar imagem no Docker
        run: docker load -i imagem.tar

      - name: Instalar Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.71.2
          cache: true

      - name: 'Trivy: vulnerabilidades da imagem (D9, fonte unica de SCA)'
        run: |
          trivy image \
            --scanners vuln \
            --format json --output "trivy-image-${ALVO_ID}.json" \
            --exit-code 0 \
            --timeout 15m \
            "$ALVO_IMAGEM:${{ github.sha }}"

      - name: 'Trivy: segredos no codigo-fonte'
        run: |
          trivy fs \
            --scanners secret \
            --skip-dirs node_modules,dist \
            --format json --output "trivy-fs-secret-${ALVO_ID}.json" \
            --exit-code 0 \
            "$ALVO_CAMINHO"

      - name: 'Trivy: IaC (Dockerfile)'
        run: |
          # Alvo e sempre o dockerfile de producao. --file-patterns acrescenta
          # padroes de deteccao, nao restringe: com o diretorio do alvo 2 como
          # alvo, varria cinco dockerfiles (corrigido em 23/09/2026). Aqui ele
          # so serve para o Trivy reconhecer o nome minusculo "dockerfile".
          args=()
          if [ -n "$ALVO_TRIVY_CONFIG_PATTERN" ]; then
            args+=(--file-patterns "$ALVO_TRIVY_CONFIG_PATTERN")
          fi
          trivy config "${args[@]}" \
            --format json --output "trivy-config-${ALVO_ID}.json" \
            --exit-code 0 \
            "$ALVO_TRIVY_CONFIG_ALVO"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ matrix.perfil }}-${{ inputs.rodada }}
          path: trivy-*.json

  quality-gate:
    name: Quality Gate (${{ matrix.perfil }})
    needs: sca
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        perfil: [alvo1-juiceshop, alvo2-uptimekuma]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Carregar perfil do alvo
        run: |
          set -a
          source "ci/perfis/${{ matrix.perfil }}.env"
          set +a
          echo "ALVO_ID=$ALVO_ID" >> "$GITHUB_ENV"

      - name: Baixar achados de SAST
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: semgrep-${{ matrix.perfil }}-${{ inputs.rodada }}
          path: achados

      - name: Baixar achados de SCA
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trivy-${{ matrix.perfil }}-${{ inputs.rodada }}
          path: achados

      - name: Instalar dependencias do script
        run: python3 -m pip install --quiet --break-system-packages pyyaml

      - name: Avaliar Quality Gate
        run: |
          python3 ci/quality_gate.py \
            --modo "$GATE_MODE" \
            --escopo "$GATE_SCOPE" \
            --trivy-image "achados/trivy-image-${ALVO_ID}.json" \
            --trivy-config "achados/trivy-config-${ALVO_ID}.json" \
            --trivy-fs-secret "achados/trivy-fs-secret-${ALVO_ID}.json" \
            --semgrep "achados/semgrep-${ALVO_ID}.json" \
            --saida "gate-decision-${ALVO_ID}.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gate-${{ matrix.perfil }}-${{ inputs.rodada }}
          path: gate-decision-*.json

  staging-dast:
    # Deploy e DAST no mesmo job: jobs rodam em runners distintos e o
    # container de staging nao sobrevive entre eles (nota do Cap. 3).
    name: Staging + DAST - OWASP ZAP (${{ matrix.perfil }})
    needs: quality-gate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        perfil: [alvo1-juiceshop, alvo2-uptimekuma]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Carregar perfil do alvo
        run: |
          set -a
          source "ci/perfis/${{ matrix.perfil }}.env"
          set +a
          {
            echo "ALVO_ID=$ALVO_ID"
            echo "ALVO_PORTA=$ALVO_PORTA"
            echo "ALVO_HEALTH=$ALVO_HEALTH"
            echo "ALVO_IMAGEM=$ALVO_IMAGEM"
            echo "ALVO_FIXTURE=$ALVO_FIXTURE"
            echo "ALVO_FIXTURE_DESTINO=$ALVO_FIXTURE_DESTINO"
          } >> "$GITHUB_ENV"

      - name: Baixar imagem construida
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: imagem-${{ matrix.perfil }}-${{ inputs.rodada }}

      - name: Carregar imagem no Docker
        run: docker load -i imagem.tar && rm imagem.tar

      - name: Staging (subir aplicacao e aguardar health check)
        run: |
          docker create --name alvo -p "${ALVO_PORTA}:${ALVO_PORTA}" "$ALVO_IMAGEM:${{ github.sha }}" >/dev/null
          if [ -n "$ALVO_FIXTURE" ]; then
            docker cp "$ALVO_FIXTURE/." "alvo:$ALVO_FIXTURE_DESTINO"
          fi
          docker start alvo
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:${ALVO_PORTA}${ALVO_HEALTH}" >/dev/null; then
              echo "Aplicacao respondeu na tentativa $i"
              exit 0
            fi
            sleep 2
          done
          echo "Aplicacao nao respondeu apos 120s"
          docker logs alvo
          exit 1

      # -m: limite do spider (min). -T limita apenas a espera do scan passivo;
      # o limite da varredura ativa e scanner.maxScanDurationInMins (risco R1).
      - name: 'OWASP ZAP: full scan'
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          target: http://localhost:${{ env.ALVO_PORTA }}
          docker_name: ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
          cmd_options: '-m 5 -T 10 -a -z "-config scanner.maxScanDurationInMins=30"'
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-relatorios-${{ matrix.perfil }}-${{ inputs.rodada }}

      # O Juice Shop caiu (segfault, exit 139) em uma de duas varreduras locais
      # (23/09/2026). Alvo fora do ar durante o DAST produz poucos alertas sem
      # erro algum; a rodada e marcada invalida em vez de entrar nos dados.
      - name: Verificar que o alvo sobreviveu ao DAST
        if: always()
        run: |
          estado=$(docker inspect alvo --format '{{.State.Status}}' 2>/dev/null || echo ausente)
          saida=$(docker inspect alvo --format '{{.State.ExitCode}}' 2>/dev/null || echo "")
          printf '{"alvo": "%s", "estado_pos_dast": "%s", "exit_code": "%s"}\n' \
            "$ALVO_ID" "$estado" "$saida" > "dast-integridade-${ALVO_ID}.json"
          cat "dast-integridade-${ALVO_ID}.json"
          if [ "$estado" != "running" ]; then
            echo "::error::Alvo nao estava em execucao ao fim do DAST (estado=$estado, exit=$saida). Rodada invalida."
            exit 1
          fi

      - name: Verificar que o ZAP produziu relatorio
        run: |
          test -s report_json.json || { echo "ZAP nao gerou report_json.json"; exit 1; }
          cp report_json.json "zap-${ALVO_ID}.json"
          python3 -c "import json,sys; d=json.load(open('zap-${ALVO_ID}.json')); print('alertas:', sum(len(s.get('alerts') or []) for s in d.get('site') or []))"

      - name: Logs da aplicacao
        if: always()
        run: docker logs alvo > "app-log-${ALVO_ID}.txt" 2>&1 || true

      - name: Encerrar container
        if: always()
        run: docker rm -f alvo || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: zap-${{ matrix.perfil }}-${{ inputs.rodada }}
          path: |
            zap-*.json
            app-log-*.txt
            dast-integridade-*.json

      # Escopo all_tools (D3): o DAST so existe depois do deploy, entao sua
      # parcela do gate e avaliada aqui, sobre SAST + SCA + DAST, com o mesmo
      # script e a mesma regra. No escopo sca_only este passo nao executa.
      - name: Baixar achados de SAST e SCA (gate pos-DAST)
        if: env.GATE_SCOPE == 'all_tools'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '{semgrep,trivy}-${{ matrix.perfil }}-${{ inputs.rodada }}'
          merge-multiple: true
          path: achados

      - name: Quality Gate pos-DAST (escopo all_tools)
        if: env.GATE_SCOPE == 'all_tools'
        run: |
          python3 -m pip install --quiet --break-system-packages pyyaml
          python3 ci/quality_gate.py \
            --modo "$GATE_MODE" \
            --escopo "$GATE_SCOPE" \
            --trivy-image "achados/trivy-image-${ALVO_ID}.json" \
            --trivy-config "achados/trivy-config-${ALVO_ID}.json" \
            --trivy-fs-secret "achados/trivy-fs-secret-${ALVO_ID}.json" \
            --semgrep "achados/semgrep-${ALVO_ID}.json" \
            --zap "zap-${ALVO_ID}.json" \
            --saida "gate-decision-final-${ALVO_ID}.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && env.GATE_SCOPE == 'all_tools'
        with:
          name: gate-final-${{ matrix.perfil }}-${{ inputs.rodada }}
          path: gate-decision-final-*.json
