# Plano das rodadas experimentais (D5). Ordem de disparo = ordem da lista.
#
# Cada execucao cobre os dois alvos (matriz dos workflows). Correspondencia com
# a matriz do plano de acao (secao 5.2):
#   BASE = E1 + E4 (baseline)             n = 10
#   AUD  = E2 + E5 (devsecops, audit)     n = 10  escopo all_tools, AJAX ligado
#   ENF  = E3 + E6 (devsecops, enforce)   n = 5   escopo sca_only,  AJAX ligado
# O escopo sca_only nas rodadas audit e derivado dos mesmos dados: a decisao
# sca_only e a parcela trivy do gate-decision (mesmo codigo, D4).
# A primeira de cada bloco (BASE-01, AUD-01, ENF-01) e aquecimento e e
# descartada da analise (D5), de forma documentada.
# Intercalacao: BASE e AUD alternados; uma ENF a cada dois pares.
lote: experimento
concorrencia_max: 4
