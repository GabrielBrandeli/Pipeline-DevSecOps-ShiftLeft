  forgedReviewChallenge: [N, N, N, "", "Edicao de review alheia; logica de autorizacao."]
  dataExportChallenge: [N, N, N, "", "Exportacao de dados de outro usuario; logica de negocio."]
  changePasswordBenderChallenge: [N, N, N, "", "Troca de senha sem a senha atual; exige sessao e encadeamento de acoes."]
  emailLeakChallenge: [N, N, N, "", "Vazamento via JSONP entre dominios; sem regra correspondente e exige sessao."]
  twoFactorAuthUnsafeSecretStorageChallenge: [N, N, N, "", "Exige obter o segredo TOTP por outra falha e gerar o codigo; encadeamento de acoes."]
  emptyUserRegistration: [N, N, N, "", "Validacao de entrada apenas no cliente; logica de negocio."]
  passwordRepeatChallenge: [N, N, N, "", "Validacao de entrada apenas no cliente; logica de negocio."]
  zeroStarsChallenge: [N, N, N, "", "Validacao de entrada apenas no cliente; logica de negocio."]
  negativeOrderChallenge: [N, N, N, "", "Quantidade negativa em pedido; logica de negocio."]
  manipulateClockChallenge: [N, N, N, "", "Cupom expirado aceito por manipulacao de data no cliente; logica de negocio."]
  freeDeluxeChallenge: [N, N, N, "", "Assinatura sem pagamento; logica de negocio."]
  uploadSizeChallenge: [N, N, N, "", "Limite de tamanho so no cliente; exige sessao e envio direcionado."]
  uploadTypeChallenge: [N, N, N, "", "Tipo de arquivo validado so no cliente; exige sessao e envio direcionado."]
  missingEncodingChallenge: [N, N, N, "", "Nome de arquivo com caractere nao codificado; exige conhecimento do recurso."]
  svgInjectionChallenge: [N, N, N, "", "Encadeamento de redirecionamento e conteudo SVG; exige conhecimento de contexto."]
  retrieveBlueprintChallenge: [N, N, N, "", "Arquivo nao referenciado descoberto por metadados de imagem; exige contexto."]

